<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Доступ запрещён | TestFlow</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
        body {
            background: #F0F0F0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header, footer {
            background: #030e1a;
            color: white;
            padding: 1.2rem 2rem;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .logo {
            font-size: 1.7rem;
            font-weight: 700;
        }
        .logo i { color: #4c9aff; margin-right: 8px; }
        nav a {
            color: #ccc;
            text-decoration: none;
            margin-left: 1.8rem;
        }
        nav a:hover { color: white; }
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }
        .error-card {
            background: white;
            border-radius: 28px;
            padding: 3rem;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        .error-card i {
            font-size: 4rem;
            color: #dc2626;
            margin-bottom: 1rem;
        }
        .error-card h1 {
            font-size: 1.8rem;
            margin-bottom: 1rem;
            color: #030e1a;
        }
        .error-card p {
            color: #6b7280;
            margin-bottom: 2rem;
        }
        .btn-primary {
            background: #030e1a;
            color: white;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 12px;
            text-decoration: none;
            display: inline-block;
        }
        footer {
            text-align: center;
            font-size: 0.85rem;
            opacity: 0.8;
        }
        @media (max-width: 700px) {
            header { flex-direction: column; gap: 1rem; }
            nav a { margin: 0 0.8rem; }
        }
    </style>
</head>
<body>
<header>
    <div class="logo"><i class="fas fa-brain"></i> TestFlow</div>
    <nav>
        <a href="/"><i class="fas fa-home"></i> Главная</a>
        <a href="/tests"><i class="fas fa-list-check"></i> Тесты</a>
        <a href="/results"><i class="fas fa-chart-simple"></i> Результаты</a>
    </nav>
</header>

<main>
    <div class="error-card">
        <i class="fas fa-lock"></i>
        <h1>Доступ запрещён</h1>
        <p>У вас нет прав для доступа к этой странице.</p>
        <a href="/" class="btn-primary">Вернуться на главную</a>
    </div>
</main>

<footer>
    <p>© 2026 TestFlow — Дипломная работа</p>
</footer>
</body>
</html>
