<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход | TestFlow</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: #F0F0F0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header, footer {
            background: #030e1a;
            color: white;
            padding: 1.2rem 2rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .logo {
            font-size: 1.7rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .logo i { color: #4c9aff; margin-right: 8px; }

        nav a {
            color: #ccc;
            text-decoration: none;
            margin-left: 1.8rem;
            font-weight: 500;
            transition: all 0.2s ease;
            padding: 0.5rem 0;
            border-bottom: 2px solid transparent;
        }
        nav a i { margin-right: 8px; }
        nav a:hover {
            color: white;
            border-bottom-color: #4c9aff;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        footer {
            text-align: center;
            font-size: 0.85rem;
            opacity: 0.8;
            margin-top: auto;
        }

        .login-card {
            background: white;
            border-radius: 28px;
            padding: 2rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }

        .login-card h1 {
            text-align: center;
            margin-bottom: 1rem;
            color: #030e1a;
        }

        .login-card h1 i {
            color: #4c9aff;
            margin-right: 0.5rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #030e1a;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 1rem;
        }

        .form-group input:focus {
            outline: none;
            border-color: #4c9aff;
        }

        button {
            width: 100%;
            padding: 0.75rem;
            background: #030e1a;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 0.5rem;
        }

        button:hover {
            background: #1a2a3a;
        }

        .error {
            background: #fee2e2;
            color: #dc2626;
            padding: 0.75rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            text-align: center;
        }

        .info {
            background: #dbeafe;
            color: #1e40af;
            padding: 0.75rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            text-align: center;
            font-size: 0.85rem;
        }

        .register-link {
            text-align: center;
            margin-top: 1rem;
        }

        .register-link a {
            color: #4c9aff;
            text-decoration: none;
        }

        @media (max-width: 700px) {
            header { flex-direction: column; gap: 1rem; }
            nav a { margin: 0 0.8rem; }
        }
    </style>
</head>
<body>
<header>
    <div class="logo"><i class="fas fa-brain"></i> TestFlow</div>
    <nav>
        <a href="/login"><i class="fas fa-sign-in-alt"></i> Вход</a>
        <a href="/register"><i class="fas fa-user-plus"></i> Регистрация</a>
    </nav>
    <div class="user-info" th:if="${#authorization.expression('isAuthenticated()')}" style="display: flex; align-items: center; gap: 1rem;">
    <span style="color: white;">
        <i class="fas fa-user-circle"></i>
        <span th:text="${#authentication.name}"></span>
    </span>
        <a href="/logout" style="color: #ccc; text-decoration: none;">
            <i class="fas fa-sign-out-alt"></i> Выход
        </a>
    </div>
</header>

<main>
    <div class="login-card">
        <h1><i class="fas fa-brain"></i> TestFlow</h1>

        <div th:if="${param.error}" class="error">
            <i class="fas fa-exclamation-triangle"></i> Неверное имя пользователя или пароль
        </div>

        <div th:if="${param.logout}" class="info">
            <i class="fas fa-check-circle"></i> Вы вышли из системы
        </div>

        <div class="info">
            <strong>Тестовые аккаунты:</strong><br>
            📚 Преподаватель: teacher / 123<br>
            🎓 Студент: student / 123
        </div>

        <form method="post" action="/login">
            <div class="form-group">
                <label><i class="fas fa-user"></i> Логин</label>
                <input type="text" name="username" required>
            </div>
            <div class="form-group">
                <label><i class="fas fa-lock"></i> Пароль</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit"><i class="fas fa-sign-in-alt"></i> Войти</button>
        </form>

        <div class="register-link">
            Нет аккаунта? <a href="/register">Зарегистрироваться</a>
        </div>
    </div>
</main>

<footer>
    <p>© 2026 TestFlow — Дипломная работа</p>
</footer>
</body>
</html>
